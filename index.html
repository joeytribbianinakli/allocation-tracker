<li>After about a minute your app is live at <code>https://YOURNAME.github.io/portfolio/</code>. Bookmark it.</li></ol>
<div class="k">Never put exported backups or any data file in this repo. It is public.</div></div>
<div class="card"><h2>Part 2: Set your passphrase</h2><ol>
<li>The first time you open the app it asks you to create a passphrase. You can change it later in <b>Backup &amp; privacy → Change passphrase</b>.</li>
<li>It needs 8+ characters with upper and lower case letters, a number and a symbol. Longer is stronger: aim for 14+ and don't reuse one from elsewhere.</li>
<li>The next screen shows your <b>recovery key</b> once. Copy it or download it, save it in your password manager, and tick the box. <b>Without your passphrase or this key, your data cannot be recovered.</b></li></ol>

<li>Under <b>Permissions → Repository permissions</b> set <b>Contents</b> to <b>Read and write</b>. Leave everything else off.</li>

<li>Enter the repository as <code>YOURNAME/portfolio-data</code>, paste the token, and click <b>Save &amp; sync</b>. If the data repo already has a saved portfolio, it replaces whatever is in this browser.</li>
<li>Check your data repo. It should now contain <code>portfolio-data.enc.json</code> with unreadable text. That's the encrypted copy.</li>

<li>On the welcome screen choose <b>Restore from GitHub</b>.</li>
<li>Enter the same repo name, token and file path.</li>
<li>Enter your original passphrase (or your recovery key) and click <b>Restore</b>. Your data loads and sync is already on. If you used the recovery key, you'll be asked to choose a new passphrase.</li></ol></div>
<div class="card"><h2>Good habits and troubleshooting</h2><ul>
<li><b>Backups:</b> use <b>Export backup</b> now and then and keep the file somewhere private. It is encrypted when a passphrase is set.</li>

<li><b>Two devices changed data:</b> the app asks which copy to keep. Sync one device before editing on another.</li>
<li><b>Recovery key:</b> keep it apart from exported backups, since anyone who has it can read your data. You can make a new one in <b>Backup &amp; privacy → Make a new recovery key</b>; the old one then stops working.</li>

/* constellation tooltip: instant on hover or keyboard focus; on a touch screen the first view needs one tap to preview a star and a second tap to open it */
(()=>{const tip=document.createElement('div');tip.id='ctip';tip.setAttribute('role','tooltip');tip.hidden=true;document.body.appendChild(tip);let cur=null,pt='mouse';
 const tgt=e=>e.target&&e.target.closest?e.target.closest('.cs [data-tip]'):null,hide=()=>{tip.hidden=true;cur=null};
 const put=(x,y)=>{const w=tip.offsetWidth,h=tip.offsetHeight;let l=x+14,t=y+16;if(l+w>innerWidth-6)l=Math.max(6,x-w-14);if(t+h>innerHeight-6)t=Math.max(6,y-h-14);tip.style.left=l+'px';tip.style.top=t+'px'};
 const show=(el,x,y)=>{cur=el;tip.textContent=el.getAttribute('data-tip');tip.hidden=false;if(x==null){const r=el.getBoundingClientRect();x=r.left+r.width/2;y=r.top+r.height/2}put(x,y)};
 document.addEventListener('pointerover',e=>{pt=e.pointerType||pt;if(e.pointerType=='touch')return;const el=tgt(e);if(el)show(el,e.clientX,e.clientY);else if(cur)hide()});
 document.addEventListener('pointermove',e=>{if(e.pointerType=='touch'||!cur)return;if(!cur.isConnected){hide();return}put(e.clientX,e.clientY)});
 document.addEventListener('pointerout',e=>{if(e.pointerType!='touch'&&cur&&!e.relatedTarget)hide()});
 document.addEventListener('pointerdown',e=>{pt=e.pointerType||pt;if(cur&&!tgt(e))hide()},true);
 document.addEventListener('keydown',()=>{pt='key'},true);
 document.addEventListener('focusin',e=>{const el=tgt(e);if(el&&el.matches(':focus-visible'))show(el);else if(cur&&!el)hide()});
 document.addEventListener('focusout',hide);
 document.addEventListener('click',e=>{const el=tgt(e);if(!el){hide();return}const sv=el.closest('svg');
  if(pt=='touch'&&sv&&sv.getAttribute('data-lv')=='0'&&cur!==el){e.stopPropagation();e.preventDefault();show(el,e.clientX,e.clientY);return}hide()},true)})();
