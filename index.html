<html lang="en"><head><meta charset="utf-8">

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-OeDuXFtsBWA8vvYqQHPxTymHK1SEMr3/VrM10lFMWak='; style-src 'unsafe-inline'; connect-src https://api.frankfurter.dev https://open.er-api.com https://api.github.com; base-uri 'none'; form-action 'none'">

<style>
:root{--bg:#f4f6f8;--c:#fff;--t:#0f1b2d;--m:#5f6c80;--b:#e2e7ee;--a:#1f6feb;--r:#d92d20;--g:#12805c}
@media(prefers-color-scheme:dark){:root{--bg:#0d1218;--c:#151c26;--t:#e6ebf2;--m:#8d99ab;--b:#263040;--a:#5b9bff;--r:#ff6b60;--g:#3ccf9b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header{background:var(--c);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:5}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;flex-wrap:wrap}
h1{font-size:17px;margin:0;flex:1;letter-spacing:-.01em}h2{font-size:16px;margin:0}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{border:0;background:none;color:var(--m);padding:10px 12px;font:inherit;font-weight:500;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--t);border-color:var(--a)}
.cnt{background:var(--r);color:#fff;border-radius:99px;padding:0 6px;font-size:11px;margin-left:4px}
button{font:inherit;cursor:pointer}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--a);outline-offset:1px}
.b,.ib,.chip{border:1px solid var(--b);background:var(--c);color:var(--t);border-radius:8px;padding:7px 12px}
.b.p{background:var(--a);border-color:var(--a);color:#fff;font-weight:600}.ib{padding:4px 8px;color:var(--m);font-size:12px}.chip{font-size:12px;color:var(--m)}
.seg{display:flex;border:1px solid var(--b);border-radius:8px;overflow:hidden}.seg button{border:0;background:none;color:var(--m);padding:6px 12px}.seg button.on{background:var(--a);color:#fff}
main{padding-bottom:48px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:16px;margin:12px 0}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.grid .card{margin:0}
.k{color:var(--m);font-size:12px}.v{font-size:22px;font-weight:650;margin-top:2px;letter-spacing:-.02em}
select,input{font:inherit;color:var(--t);background:var(--bg);border:1px solid var(--b);border-radius:8px;padding:8px 10px;width:100%}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.sp{flex:1}
table{width:100%;border-collapse:collapse}td{padding:8px 4px;border-bottom:1px solid var(--b)}tr:last-child td{border:0}.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:8px}
.bar{height:8px;border-radius:99px;background:var(--b);overflow:hidden;display:flex;position:relative;margin:10px 0}.bar i{display:block;height:100%}
.bar u{position:absolute;top:0;bottom:0;width:2px;background:var(--t)}
.alert{border:1px solid var(--r);background:color-mix(in srgb,var(--r) 9%,transparent);border-radius:12px;padding:12px 14px;margin:12px 0}
.tag{border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}.tag.ok{color:var(--g);background:color-mix(in srgb,var(--g) 14%,transparent)}.tag.bad{color:var(--r);background:color-mix(in srgb,var(--r) 14%,transparent)}
.th{display:flex;justify-content:space-between;margin:22px 4px 0;font-weight:650;font-size:15px}
.charts{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.donut{width:100%;max-width:210px;display:block;margin:0 auto 12px}
.sel{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.sel label{flex:1;min-width:160px;display:grid;gap:4px;color:var(--m);font-size:12px}
.empty{text-align:center;padding:40px 16px}.empty p{color:var(--m)}
dialog{border:1px solid var(--b);border-radius:14px;background:var(--c);color:var(--t);padding:20px;width:min(440px,92vw)}dialog::backdrop{background:#0009}
dialog h3{margin:0 0 14px}.f{display:grid;gap:12px}.f label{display:grid;gap:4px;color:var(--m);font-size:12px}.two{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.ar{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.er{color:var(--r);margin:0;min-height:1em;font-size:13px}.lk .cx{display:none}
.menu{display:grid;gap:8px}.menu .b{text-align:left}
.rk{font:600 15px/1.7 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.04em;text-align:center;background:var(--bg);border:1px dashed var(--b);border-radius:10px;padding:12px;user-select:all}
.f .chk{display:flex;align-items:center;gap:8px;color:var(--t);font-size:13px}.f .chk input{width:auto}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--t);color:var(--bg);padding:9px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s}#toast.show{opacity:1}
.foot{color:var(--m);font-size:12px;text-align:center;margin-top:24px}
.g a{color:var(--a)}.g ol,.g ul{margin:8px 0 0;padding-left:20px}.g li{margin:6px 0}.g code{background:var(--bg);border:1px solid var(--b);border-radius:6px;padding:0 5px}.g h2{margin-bottom:4px}.g .k{margin-top:8px}
</style></head><body>
<header>
 <div class="wrap top"><h1>Portfolio</h1>
  <div class="seg"><button data-act="cur" data-v="CAD">CAD</button><button data-act="cur" data-v="USD">USD</button></div>
  <button class="chip" id="fxb" data-act="fx" title="Exchange rate"></button>
  <button class="b" data-act="menu" aria-label="Backup and privacy">Backup &amp; privacy</button></div>
 <nav class="wrap" id="tabs"></nav>
</header>
<main class="wrap" id="app"></main>
<dialog id="dlg"></dialog><div id="toast"></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script>
const $=s=>document.querySelector(s),K='portfolio.v1';
const TYPES=['TFSA','RRSP','FHSA','Non-registered','RESP','Other'],CLS=['ETFs','Stocks','Bonds','Gold','Cash','Crypto','Real estate','Other'];
const COL=['#2f6fed','#17a58a','#f2a30f','#e5484d','#8e6bf2','#3bb5e8','#7bb83d','#e5609f','#8a97a8'];
const uid=()=>Math.random().toString(36).slice(2,9),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const today=()=>new Date().toLocaleDateString('en-CA'),YR=new Date().getFullYear();
const dflt=()=>({accounts:[],limits:[],contribs:[],fx:{r:1.37,d:null,manual:false},cur:'CAD',sync:{},cats:{types:[...TYPES],cls:[...CLS]}});
let S=dflt(),lock=null,U={tab:'overview',scope:'all',by:'cls',year:YR};
const norm=o=>{const d=dflt();for(const k in d)if(o&&o[k]!=null&&typeof o[k]==typeof d[k])d[k]=o[k];const nu=v=>Number.isFinite(+v)?+v:0;d.accounts.forEach(a=>{a.h=Array.isArray(a.h)?a.h:[];a.h.forEach(h=>h.amt=nu(h.amt));a.room=nu(a.room);if(a.rooms&&typeof a.rooms=='object')for(const y in a.rooms)a.rooms[y]=nu(a.rooms[y])});d.contribs.forEach(c=>{c.amt=nu(c.amt);c.cad=nu(c.cad);c.date=String(c.date||'')});d.limits.forEach(l=>l.max=nu(l.max));if(!(d.fx.r>0))d.fx.r=1.37;if(!Array.isArray(d.cats.types)||!Array.isArray(d.cats.cls))d.cats=dflt().cats;return d};
/* ---------- money ---------- */
const R=()=>S.fx.r,toCAD=(a,c)=>c=='USD'?a*R():a,pc=x=>(x*100).toFixed(1)+'%';
const nf=(c,d=0)=>new Intl.NumberFormat('en-CA',{style:'currency',currency:c,maximumFractionDigits:d,minimumFractionDigits:d});
const fmt=v=>nf(S.cur).format(S.cur=='CAD'?v:v/R()),fmtN=(a,c)=>nf(c,2).format(a);
const cm={},col=n=>cm[n]??=COL[Object.keys(cm).length%COL.length];
/* ---------- data helpers ---------- */
const acc=id=>S.accounts.find(a=>a.id==id);
const rows=()=>S.accounts.flatMap(a=>a.h.map(h=>({a,h,v:toCAD(h.amt,h.cur)})));
const sum=r=>r.reduce((s,x)=>s+x.v,0);
const filt=(sc,r=rows())=>sc=='all'?r:sc[0]=='a'?r.filter(x=>x.a.id==sc.slice(2)):r.filter(x=>x.a.type==sc.slice(2));
const KEY={cls:x=>x.h.cls,acc:x=>x.a.name,type:x=>x.a.type,cur:x=>x.h.cur};
const group=(r,by)=>{const m={};r.forEach(x=>{const k=KEY[by](x);m[k]=(m[k]||0)+x.v});return Object.entries(m).filter(e=>e[1]>0).sort((a,b)=>b[1]-a[1])};
const catT=()=>[...new Set([...S.cats.types,...S.accounts.map(a=>a.type)])];
const types=()=>{const c=catT();return[...new Set(S.accounts.map(a=>a.type))].sort((a,b)=>c.indexOf(a)-c.indexOf(b))};
const allCls=()=>[...new Set([...S.cats.cls,...rows().map(x=>x.h.cls)])];
const canon=(v,l)=>l.find(x=>x.toLowerCase()==v.toLowerCase())||v;
const scopeName=sc=>sc=='all'?'entire portfolio':sc[0]=='t'?sc.slice(2)+' accounts':(acc(sc.slice(2))?.name||'deleted account');
const scopeOpts=()=>[['all','Entire portfolio'],...types().map(t=>['t:'+t,'All '+t+' accounts']),...S.accounts.map(a=>['a:'+a.id,a.name+' ('+a.type+')'])];
const O=(l,sel)=>l.map(x=>{const[v,t]=Array.isArray(x)?x:[x,x];return `<option value="${esc(v)}"${v==sel?' selected':''}>${esc(t)}</option>`}).join('');
const lim=L=>{const r=filt(L.sc),t=sum(r),m=sum(r.filter(x=>L.k=='cur'?x.h.cur==L.val:x.h.cls==L.val));return{t,m,p:t?m/t:0}};
const breaches=()=>S.limits.map(L=>({L,...lim(L)})).filter(x=>x.p*100>x.L.max+1e-9);
const lname=L=>L.k=='cur'?L.val+' holdings':L.val;
const roomOf=(a,y)=>a.rooms?.[y]??a.room??0;
/* ---------- persistence & privacy (AES-GCM, key derived from your passphrase) ---------- */
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const IT=600000,itOf=o=>{const n=+o.it;return Number.isInteger(n)&&n>=250000&&n<=2e6?n:250000};
async function key(p,salt,it=250000){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:it,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
const rb=n=>crypto.getRandomValues(new Uint8Array(n)),aes=b=>crypto.subtle.importKey('raw',b,'AES-GCM',false,['encrypt','decrypt']);
/* Your data is locked with a random master key. That key is itself locked twice: by your passphrase and by a recovery key. Either one opens it. */
const wrap=async(k,mb)=>{const i=rb(12);return{i:b64(i),d:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv:i},k,mb))}},unwrap=async(k,w)=>new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(w.i)},k,ub(w.d)));
const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567',normRK=x=>String(x).toUpperCase().replace(/0/g,'O').replace(/1/g,'I').replace(/[^A-Z2-7]/g,'');
function genRK(){let v=0,n=0,o='';for(const x of rb(20)){v=(v<<8)|x;n+=8;while(n>=5){o+=B32[(v>>>(n-5))&31];n-=5}}return o.match(/.{4}/g).join('-')}
const hdrOf=o=>({s:o.s,w:o.w,rs:o.rs,r:o.r,it:o.it});
async function enc(o=S){const iv=rb(12),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},lock.k,new TextEncoder().encode(JSON.stringify(o))),b={i:b64(iv),d:b64(ct)};return lock.hdr?{enc:2,...lock.hdr,...b}:{enc:1,s:b64(lock.s),...b}}
async function opn(o,mb){const k=await aes(mb),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.i)},k,ub(o.d));return[JSON.parse(new TextDecoder().decode(pt)),{k,mb,hdr:hdrOf(o)}]}
async function dec(o,p){const s=ub(o.s),k=await key(p,s,itOf(o));if(o.enc==2)return opn(o,await unwrap(k,o.w));const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.i)},k,ub(o.d));return[JSON.parse(new TextDecoder().decode(pt)),{k,s,legacy:1}]}
const recDec=async(o,rk)=>opn(o,await unwrap(await key(normRK(rk),ub(o.rs)),o.r));
async function openAny(o,x){try{const[d,l]=await dec(o,x);return[d,l,0]}catch(e){if(o.enc==2&&o.r&&normRK(x).length==32){const[d,l]=await recDec(o,x);return[d,l,1]}throw e}}
const pack=async(exp)=>{let o=S;if(exp){const{sync,...r}=S;o=r}return lock?await enc(o):o};
const persist=()=>pack().then(o=>localStorage.setItem(K,JSON.stringify(o)));
let tm;
const save=()=>{if(S.sync?.token){S.sync.dirty=true;S.sync.n=(S.sync.n||0)+1;clearTimeout(tm);tm=setTimeout(doSync,2500)}return persist().catch(e=>toast('Could not save: '+e.message))};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2800)};
/* ---------- forex (free, no key; only the rate is requested, never your data) ---------- */
async function fetchFx(){const src=[['https://api.frankfurter.dev/v1/latest?base=USD&symbols=CAD',j=>[j.rates.CAD,j.date]],['https://open.er-api.com/v6/latest/USD',j=>[j.rates.CAD,today()]]];
 for(const[u,f]of src){try{const r=await fetch(u,{cache:'no-store',referrerPolicy:'no-referrer'});if(!r.ok)continue;const[x,d]=f(await r.json());if(x>0){S.fx={r:x,d,manual:false};persist().catch(()=>{});render();return true}}catch(e){}}return false}
/* ---------- charts ---------- */
function donut(g,t){let o=25,s='';g.forEach(([n,v])=>{const p=v/t*100;s+=`<circle r="15.9155" cx="21" cy="21" fill="none" stroke="${col(n)}" stroke-width="6" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${o}"><title>${esc(n)}: ${pc(v/t)}</title></circle>`;o-=p});
 return `<svg viewBox="0 0 42 42" class="donut" role="img">${s}<text x="21" y="22.3" text-anchor="middle" font-size="3.1" font-weight="700" fill="currentColor">${fmt(t)}</text></svg>`}
const legend=(g,t)=>`<table>${g.map(([n,v])=>`<tr><td><span class="dot" style="background:${col(n)}"></span>${esc(n)}</td><td class="n">${fmt(v)}</td><td class="n">${pc(v/t)}</td></tr>`).join('')}</table>`;
/* ---------- views ---------- */
const emptyCard=`<div class="card empty"><h2>No accounts yet</h2><p>Add an account (TFSA, RRSP, FHSA, non-registered…), then add what you hold in it.</p><button class="b p" data-act="addAcc">Add account</button></div>`;
function vOver(){const all=rows(),T=sum(all);if(!S.accounts.length)return emptyCard;
 const al=breaches(),cadN=sum(all.filter(x=>x.h.cur=='CAD')),usdV=sum(all.filter(x=>x.h.cur=='USD'));
 const sr=filt(U.scope),st=sum(sr),g=group(sr,U.by),gc=group(sr,'cur');
 return (al.length?`<div class="alert"><b>${al.length} limit${al.length>1?'s':''} exceeded</b>${al.map(b=>`<div>${esc(lname(b.L))} is ${pc(b.p)} of ${esc(scopeName(b.L.sc))} (limit ${b.L.max}%)</div>`).join('')}</div>`:'')+
 `<div class="grid" style="margin-top:12px"><div class="card"><div class="k">Total value</div><div class="v">${fmt(T)}</div><div class="k">1 USD = ${R().toFixed(4)} CAD</div></div>
 <div class="card"><div class="k">Held in CAD</div><div class="v">${fmtN(cadN,'CAD')}</div><div class="k">${pc(T?cadN/T:0)} of portfolio</div></div>
 <div class="card"><div class="k">Held in USD</div><div class="v">${fmtN(usdV/R(),'USD')}</div><div class="k">${pc(T?usdV/T:0)} of portfolio · ≈ ${fmt(usdV)}</div></div></div>
 <div class="card"><div class="sel"><label>View<select data-chg="scope">${O(scopeOpts(),U.scope)}</select></label>
 <label>Group by<select data-chg="by">${O([['cls','Investment type'],['acc','Account'],['type','Account type'],['cur','Currency']],U.by)}</select></label></div>
 ${st?`<div class="charts"><div>${donut(g,st)}${legend(g,st)}</div><div><div class="k" style="text-align:center;margin-bottom:6px">CAD vs USD</div>${donut(gc,st)}${legend(gc,st)}</div></div>`:'<p class="k">Nothing held in this selection yet.</p>'}</div>`}
function vAcc(){const T=sum(rows());let h=`<div class="row" style="margin:16px 0 0"><h2 class="sp">Accounts</h2><button class="b" data-act="manage">Manage types</button><button class="b p" data-act="addAcc">Add account</button></div>`;if(!S.accounts.length)return h+emptyCard;
 types().forEach(t=>{h+=`<div class="th"><span>${esc(t)}</span><span>${fmt(sum(filt('t:'+t)))}</span></div>`;
  S.accounts.filter(a=>a.type==t).forEach(a=>{const r=filt('a:'+a.id),at=sum(r),g=group(r,'cls'),cn=sum(r.filter(x=>x.h.cur=='CAD')),us=sum(r.filter(x=>x.h.cur=='USD'));
   h+=`<div class="card"><div class="row"><div class="sp"><b>${esc(a.name)}</b><div class="k">${pc(T?at/T:0)} of portfolio · CAD ${pc(at?cn/at:0)} / USD ${pc(at?us/at:0)}</div></div><div class="v" style="font-size:18px">${fmt(at)}</div>
   <button class="ib" data-act="editAcc" data-id="${esc(a.id)}">Edit</button><button class="ib" data-act="delAcc" data-id="${esc(a.id)}">Delete</button></div>
   <div class="bar">${g.map(([n,v])=>`<i title="${esc(n)}" style="width:${v/at*100}%;background:${col(n)}"></i>`).join('')}</div>
   <table>${a.h.map(x=>`<tr><td><span class="dot" style="background:${col(x.cls)}"></span>${esc(x.cls)}</td><td class="n">${fmtN(x.amt,x.cur)}</td><td class="n">${fmt(toCAD(x.amt,x.cur))}</td><td class="n">${pc(at?toCAD(x.amt,x.cur)/at:0)}</td>
   <td class="n"><button class="ib" data-act="editH" data-id="${esc(a.id)}" data-h="${esc(x.id)}">Edit</button><button class="ib" data-act="delH" data-id="${esc(a.id)}" data-h="${esc(x.id)}">Remove</button></td></tr>`).join('')}</table>
   <button class="b" style="margin-top:8px" data-act="addH" data-id="${esc(a.id)}">Add holding</button></div>`})});return h}
function vCon(){const ys=[...new Set([YR,U.year,...S.contribs.map(c=>+c.date.slice(0,4))])].sort((a,b)=>b-a),y=U.year,cs=S.contribs.filter(c=>c.date.startsWith(y)).sort((a,b)=>b.date.localeCompare(a.date));
 const as=S.accounts.filter(a=>roomOf(a,y)>0||cs.some(c=>c.acc==a.id));
 return `<div class="row" style="margin:16px 0"><h2 class="sp">Contributions</h2><select data-chg="year" style="width:auto">${O(ys.map(String),String(y))}</select><button class="b p" data-act="addC">Add contribution</button></div>`+
 (as.length?as.map(a=>{const p=sum(cs.filter(c=>c.acc==a.id).map(c=>({v:c.cad}))),rm=roomOf(a,y),o=rm>0&&p>rm;
  return `<div class="card"><div class="row"><div class="sp"><b>${esc(a.name)}</b> <span class="k">${esc(a.type)}</span><div class="k">${rm>0?`${fmt(p)} of ${fmt(rm)} room · ${o?`<b style="color:var(--r)">${fmt(p-rm)} over</b>`:fmt(rm-p)+' left'}`:`${fmt(p)} contributed · no room set`}</div></div>
  ${rm>0?`<span class="tag ${o?'bad':'ok'}">${o?'Over limit':pc(p/rm)}</span>`:''}<button class="ib" data-act="editRoom" data-id="${esc(a.id)}">Set ${y} room</button></div>
  ${rm>0?`<div class="bar"><i style="width:${Math.min(100,p/rm*100)}%;background:${o?'var(--r)':'var(--g)'}"></i></div>`:''}</div>`}).join(''):`<div class="card empty"><p>Set yearly contribution room on an account (Edit account), or log a contribution to begin.</p></div>`)+

const usage=(k,n)=>k=='types'?S.accounts.filter(a=>a.type==n).length:rows().filter(x=>x.h.cls==n).length;
function catModal(){S.cats.types=catT();S.cats.cls=allCls();
 const sec=(k,t,hint)=>`<div><b>${t}</b>${S.cats[k].map((n,i)=>`<div class="row" style="margin-top:6px"><input id="cn-${k}-${i}" value="${esc(n)}" style="flex:1;min-width:120px"><span class="k">${usage(k,n)} in use</span><button class="ib" data-act="catRen" data-k="${k}" data-i="${i}">Rename</button><button class="ib" data-act="catDel" data-k="${k}" data-i="${i}">Delete</button></div>`).join('')}
 <div class="row" style="margin-top:8px"><input id="cn-${k}-new" placeholder="${hint}" style="flex:1;min-width:120px"><button class="b" data-act="catAdd" data-k="${k}">Add</button></div></div>`;
 modal('Manage categories',sec('types','Account types','New type, e.g. LIRA')+sec('cls','Investment types','New type, e.g. REITs')+'<div class="k">Renaming updates everything that uses the name. Renaming to an existing name merges the two. Types that are in use can\'t be deleted.</div>')}
/* ---------- first run: create passphrase or restore from GitHub ---------- */
let boot;
function welcome(done){boot=done;
 modal('Create a passphrase',`<div class="k">Your portfolio is encrypted with this passphrase before it is saved, and you'll enter it each time you open the app. On the next screen you'll get a recovery key for the day you forget it.</div>
 <label>Passphrase (8+ characters with upper and lower case, a number and a symbol)<input id="p1" type="password" autocomplete="new-password"></label><label>Confirm<input id="p2" type="password" autocomplete="new-password"></label>
 
 ${S.accounts.length?'':'<button class="b" data-act="restoreGH">Already use this on another device? Restore from GitHub</button>'}`,'Create',async()=>{
 const p=$('#p1').value,e=pwErr(p,$('#p2').value);if(e)return bad(e);
 const{L,rk}=await mkLock(p);showKey(rk,L,done,'lk');return false},'lk')}
function restoreModal(){
 modal('Restore from GitHub',`<div class="k">Enter the same repository, token and passphrase you use on your other device. If you forgot the passphrase, enter your recovery key instead.</div>
 <label>Repository (owner/name)<input id="gr" placeholder="yourname/portfolio-data"></label><label>Access token<input id="gt" type="password" autocomplete="off"></label>
 <label>File path<input id="gp" value="portfolio-data.enc.json"></label><label>Passphrase or recovery key<input id="pp" type="password" autocomplete="current-password"></label><button class="b" data-act="welcomeBack">Back</button>`,'Restore',async()=>{
 const repo=$('#gr').value.trim(),token=$('#gt').value.trim(),path=$('#gp').value.trim().replace(/^\/+/,''),p=$('#pp').value;
 if(!/^[\w.-]+\/[\w.-]+$/.test(repo))return bad('Use the form owner/name');if(!token||!path||!p)return bad('Fill in every field');
 S.sync={repo,token,path};let rm;try{rm=await remote()}finally{S.sync={}}
 if(!rm)return bad('No synced file found at that path');
 let d,l,rv;try{[d,l,rv]=await openAny(rm.o,p)}catch{return bad('Wrong passphrase or recovery key')}
 lock=l;S=norm(d);S.sync={repo,token,path,sha:rm.sha,dirty:false,n:0,at:Date.now()};
 if(rv){resetPass(boot);return false}
 await persist();boot()},'lk')}
/* ---------- events ---------- */
const ACT={tab:d=>{U.tab=d.v;render()},cur:d=>{S.cur=d.v;save();render()},fx:fxModal,menu:menuModal,x:()=>$('#dlg').close(),
 addAcc:()=>accModal(),editAcc:d=>accModal(d.id),addH:d=>hModal(d.id),editH:d=>hModal(d.id,d.h),addC:cModal,addL:lModal,editRoom:d=>roomModal(d.id),setPass:passModal,
 delAcc:d=>{if(!confirm('Delete this account and all its holdings, contributions and limits?'))return;S.accounts=S.accounts.filter(a=>a.id!=d.id);S.contribs=S.contribs.filter(c=>c.acc!=d.id);S.limits=S.limits.filter(l=>l.sc!='a:'+d.id);if(U.scope=='a:'+d.id)U.scope='all';save();render()},
 delH:d=>{if(!confirm('Remove this holding?'))return;const a=acc(d.id);a.h=a.h.filter(x=>x.id!=d.h);save();render()},
 delC:d=>{S.contribs=S.contribs.filter(c=>c.id!=d.id);save();render()},delL:d=>{S.limits=S.limits.filter(l=>l.id!=d.id);save();render()},
 live:async()=>{toast('Fetching…');const ok=await fetchFx();toast(ok?'Rate updated':'Could not reach the rate service');if(ok)fxModal()},
 exp:async()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(await pack(true),null,1)],{type:'application/json'}));a.download=`portfolio-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3);toast(lock?'Encrypted backup saved':'Backup saved (unencrypted)')},
 imp:()=>$('#file').click(),manage:catModal,
 catAdd:d=>{const n=$(`#cn-${d.k}-new`).value.trim();if(!n)return;if(S.cats[d.k].some(x=>x.toLowerCase()==n.toLowerCase()))return toast('That name already exists');S.cats[d.k].push(n);save();catModal()},
 catDel:d=>{const n=S.cats[d.k][d.i],u=usage(d.k,n);if(u)return toast(`“${n}” is in use (${u}). Rename it to merge, or remove those items first.`);S.cats[d.k].splice(d.i,1);save();catModal()},
 catRen:d=>{const L=S.cats[d.k],old=L[d.i],n=$(`#cn-${d.k}-${d.i}`).value.trim();if(!n||n==old)return;
  const j=L.findIndex((x,i)=>i!=d.i&&x.toLowerCase()==n.toLowerCase());if(j>=0&&!confirm(`“${L[j]}” already exists. Merge “${old}” into it?`))return;const nn=j>=0?L[j]:n;
  if(d.k=='types'){S.accounts.forEach(a=>{if(a.type==old)a.type=nn});S.limits.forEach(l=>{if(l.sc=='t:'+old)l.sc='t:'+nn});if(U.scope=='t:'+old)U.scope='t:'+nn}
  else{rows().forEach(x=>{if(x.h.cls==old)x.h.cls=nn});S.limits.forEach(l=>{if(l.k=='cls'&&l.val==old)l.val=nn})}
  if(j>=0)L.splice(d.i,1);else L[d.i]=nn;save();render();catModal()},sync:()=>lock?syncModal():(toast('Set a passphrase first. Sync only uploads encrypted data.'),passModal()),syncNow:()=>doSync(true),
 unsync:()=>{if(!confirm('Stop syncing on this device? Your local data and the GitHub copy are kept.'))return;S.sync={};persist();render();$('#dlg').close()},
 restoreGH:()=>restoreModal(),welcomeBack:()=>welcome(boot),
 useRK:recUnlock,backUL:()=>unlock(UL.o,UL.done,UL.keep),recKey:recModal,
 rkCopy:async()=>{try{await navigator.clipboard.writeText(curRK);$('#rkc').textContent='Copied ✓'}catch{bad('Could not copy automatically. Select the key above and copy it.')}},
 rkSave:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([`Portfolio tracker recovery key\n${curRK}\n\nCreated ${today()}. Anyone with this key can unlock your portfolio data. Keep it private and apart from your backups.\n`],{type:'text/plain'}));a.download='portfolio-recovery-key.txt';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)},
 lockNow:()=>location.reload(),
 wipe:()=>{if((prompt('Erase ALL saved data in this browser? Your GitHub copy, if any, is not touched. This cannot be undone.\n\nType ERASE to confirm.')||'').trim()=='ERASE'){localStorage.removeItem(K);location.reload()}else toast('Nothing was erased')}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)ACT[b.dataset.act]?.(b.dataset)});
document.addEventListener('change',e=>{const t=e.target,k=t.dataset.chg;if(t.dataset.new){const n=$('#'+t.dataset.new);n.hidden=t.value!='__new';if(!n.hidden)n.focus()}if(k){U[k]=k=='year'?+t.value:t.value;render()}});
$('#file').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const o=JSON.parse(await f.text()),sy=S.sync;if(o.enc){unlock(o,()=>{S.sync=sy;save();render();toast('Backup restored')},true);$('#dlg').querySelector('.cx').style.display='';$('#dlg').className='';}else{if(!confirm('Replace current data with this backup?'))return;S=norm(o);S.sync=sy;await save();render();toast('Backup restored')}}catch(err){toast('That file isn\'t a valid backup')}};
/* ---------- start ---------- */
(async()=>{let o=null;const raw=localStorage.getItem(K);try{o=JSON.parse(raw)}catch{if(raw)localStorage.setItem(K+'.bak',raw)}
 if(o&&o.enc)await new Promise(r=>unlock(o,r));else{if(o)S=norm(o);await new Promise(r=>welcome(r))}
 render();if(!S.fx.manual)fetchFx().then(ok=>{if(!ok)toast('Offline: using last saved rate')});setTimeout(doSync,500);if(lock?.legacy)setTimeout(()=>{recModal();$('#dlg').addEventListener('close',()=>doSync(),{once:true})},60)})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)doSync()});addEventListener('online',()=>doSync());
let idle;const bump=()=>{clearTimeout(idle);idle=setTimeout(()=>{if(lock)location.reload()},6e5)};['click','keydown','touchstart','mousemove'].forEach(ev=>addEventListener(ev,bump,{passive:true}));bump();
</script></body></html>
