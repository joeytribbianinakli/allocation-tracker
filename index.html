async function remote(){const r=await gh('GET');if(r.status==404)return null;if(!r.ok)throw ghErr(r);const j=await r.json();return{sha:j.sha,o:JSON.parse(atob(j.content.replace(/\s/g,'')))}}
async function push(sha){const n0=S.sync.n||0,{sync,...rest}=S,body={message:'Update portfolio data',content:btoa(JSON.stringify(await enc(rest)))};if(sha)body.sha=sha;
 const r=await gh('PUT',body);if(!r.ok)throw ghErr(r);S.sync.sha=(await r.json()).content.sha;S.sync.dirty=(S.sync.n||0)!=n0;S.sync.at=Date.now();
 if(S.sync.dirty){clearTimeout(tm);tm=setTimeout(doSync,300)}}
async function pullDec(o){
 if(lock?.hdr&&o.enc==2){try{const[d]=await opn(o,lock.mb);return[d,{...lock,hdr:hdrOf(o)}]}catch{}}
 else if(lock?.legacy&&o.enc!=2&&o.s==b64(lock.s)){const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub(o.i)},lock.k,ub(o.d));return[JSON.parse(new TextDecoder().decode(pt)),lock]}
 return new Promise((res,rej)=>{modal('Passphrase from your other device','<div class="k">The synced data was locked with a different passphrase than this device uses. Enter that passphrase, or its recovery key.</div><label>Passphrase or recovery key<input id="p" type="password"></label>','Unlock',async()=>{try{const[d,l]=await openAny(o,$('#p').value);res([d,l])}catch{return bad('Wrong passphrase or recovery key')}});
  $('#dlg').addEventListener('close',()=>rej(new Error('cancelled')),{once:true})})}
async function doSync(manual){
 if(!S.sync?.token||busy)return;if(manual!==true&&$('#dlg').open){if(S.sync.dirty){clearTimeout(tm);tm=setTimeout(doSync,2000)}return}busy=true;
 try{if(!lock)throw new Error('Set a passphrase first');
  const rm=await remote();
  if(rm&&rm.sha!=S.sync.sha){const[d,l]=await pullDec(rm.o);
   const first=!S.sync.sha,had=first&&S.accounts.length>0;
   if(first||!(S.sync.dirty&&S.accounts.length)||confirm('Newer data from another device was found.\n\nOK: load it (replaces this device\'s data)\nCancel: keep this device\'s data and overwrite the other copy')){
    const sy={...S.sync,sha:rm.sha,dirty:false,at:Date.now()};S=norm(d);S.sync=sy;lock=l;await persist();syncErr='';syncWait=0;toast(had?'Replaced local data with your GitHub copy':'Loaded your latest synced data');return}}
  if(S.sync.dirty||!rm||manual===true){await push(rm?.sha);await persist();syncErr='';syncWait=0;if(manual===true)toast('Synced')}else{S.sync.at=Date.now();syncErr='';syncWait=0}
 }catch(e){if(e.message!='cancelled'){syncErr=e.message;toast('Sync failed: '+e.message);if(S.sync?.dirty){syncWait=syncWait?Math.min(syncWait*3,60000):5000;clearTimeout(tm);tm=setTimeout(doSync,syncWait)}}}finally{busy=false;render()}}
